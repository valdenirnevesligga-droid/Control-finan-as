<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Meu Dinheiro</title>
<style>
:root{--bg:#f3f6fa;--card:#fff;--txt:#17202e;--sub:#667085;--pri:#0f766e;--pri2:#14b8a6;--soft:#e6f7f4;--in:#15803d;--out:#e11d48;--warn:#f59e0b;--bd:#e7ebf1;--chip:#eef2f6;--sh:0 6px 22px rgba(16,24,40,.07)}
:root[data-tema="escuro"]{--bg:#0e141b;--card:#17202b;--txt:#e8edf3;--sub:#93a1b3;--soft:#12302d;--in:#34d399;--out:#fb7185;--bd:#263241;--chip:#223040;--sh:0 6px 22px rgba(0,0,0,.35)}
@media (prefers-color-scheme:dark){:root[data-tema="auto"]{--bg:#0e141b;--card:#17202b;--txt:#e8edf3;--sub:#93a1b3;--soft:#12302d;--in:#34d399;--out:#fb7185;--bd:#263241;--chip:#223040;--sh:0 6px 22px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--txt);line-height:1.35;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer;color:inherit}
header{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 74px;border-radius:0 0 30px 30px}
header.compacto{padding-bottom:56px}
.topo{display:flex;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.2px}
.ver{font-size:11px;opacity:.75}
.mes{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.mes button{background:rgba(255,255,255,.2);border:0;color:#fff;width:40px;height:40px;border-radius:50%;font-size:20px}
.mes span{font-size:17px;font-weight:700;text-transform:capitalize}
.wrap{padding:0 16px;margin:-52px auto 0;max-width:640px}
header.compacto+.wrap{margin-top:-38px}
.card{background:var(--card);border-radius:20px;padding:18px;box-shadow:var(--sh);margin-bottom:14px}
.titulo{font-weight:700;margin:0 0 12px;font-size:16px}
.saldo small{color:var(--sub);font-size:13px}
.saldo h2{margin:2px 0 14px;font-size:32px;letter-spacing:-.5px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.mini{background:var(--bg);border-radius:14px;padding:10px}
.mini small{display:block;color:var(--sub);font-size:11px}
.mini b{font-size:14px}
.in{color:var(--in)}.out{color:var(--out)}.neu{color:var(--sub)}
.vazio{text-align:center;color:var(--sub);padding:16px 8px;font-size:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{border:0;background:none;padding:10px;border-radius:11px;font-size:14px;font-weight:600;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--pri);box-shadow:0 2px 8px rgba(16,24,40,.08)}
.btnImp{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border:2px dashed var(--pri2);border-radius:16px;background:var(--soft);color:var(--pri);font-size:15px;font-weight:700;margin:0 0 14px;cursor:pointer}
.btnImp small{font-weight:500;color:var(--sub);font-size:12px;margin:0}
.secao{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 10px}
.secao b{font-size:16px}
.mini-btn{border:0;background:var(--soft);color:var(--pri);font-weight:700;font-size:13px;padding:8px 13px;border-radius:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.dow{font-size:11px;color:var(--sub);padding:4px 0}
.dia{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;background:transparent;border:0;color:var(--txt);padding:0}
.dia.hoje{box-shadow:inset 0 0 0 2px var(--pri)}
.dia.sel{background:var(--pri);color:#fff}
.pt{display:flex;gap:2px;margin-top:2px;height:5px}
.pt i{width:5px;height:5px;border-radius:50%}
.pt .i{background:var(--in)}.pt .o{background:var(--out)}.pt .n{background:var(--sub)}
.sel .pt i{background:#fff}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--bd)}
.item:last-child{border:0}
.ico{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--bg);flex:none}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t small{color:var(--sub);font-size:12px}
.val{white-space:nowrap;font-size:14px}
.dhead{font-size:12px;color:var(--sub);font-weight:700;margin:14px 0 2px}
.busca{width:100%;padding:12px 14px;border:1px solid var(--bd);border-radius:12px;font-size:15px;background:var(--bg);color:var(--txt)}
.chips{display:flex;gap:8px;margin:10px 0 4px;flex-wrap:wrap}
.chips button{border:0;background:var(--chip);color:var(--sub);padding:7px 13px;border-radius:20px;font-size:13px;font-weight:600}
.chips button.on{background:var(--pri);color:#fff}
.alerta{border-left:5px solid var(--warn)}
.venc{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:14px}
.venc small{display:block;color:var(--sub);font-size:12px}
.barra{height:10px;background:var(--bg);border-radius:6px;overflow:hidden;margin-top:6px}
.barra i{display:block;height:100%;border-radius:6px}
.orc{margin-bottom:14px}.orc:last-child{margin-bottom:0}
.orcl{display:flex;justify-content:space-between;font-size:14px}
.orcl small{color:var(--sub);font-weight:400}
.chk{width:30px;height:30px;border-radius:10px;border:2px solid var(--bd);background:var(--card);color:#fff;font-weight:800;flex:none}
.chk.on{background:var(--pri2);border-color:var(--pri2)}
.conta{display:flex;align-items:center;gap:12px}
.conta .t{flex:1}.conta .t b{display:block}.conta .t small{color:var(--sub);font-size:12px}
.cartao{border-radius:20px;padding:18px;color:#fff;margin-bottom:14px;box-shadow:var(--sh)}
.cartao .l1{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.cartao .fat{font-size:26px;font-weight:800;margin:10px 0 2px;letter-spacing:-.4px}
.cartao small{opacity:.85;font-size:12px}
.cartao .barra{background:rgba(255,255,255,.25)}
.cartao .barra i{background:#fff}
.cartao .bt{display:flex;gap:8px;margin-top:12px}
.cartao .bt button{flex:1;border:0;border-radius:12px;padding:10px;background:rgba(255,255,255,.22);color:#fff;font-weight:700;font-size:13px}
.leg{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:14px}
.leg i{width:12px;height:12px;border-radius:4px;flex:none}
.leg b{margin-left:auto;white-space:nowrap}
canvas{width:100%;display:block}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats .mini b{display:block;font-size:16px;margin-top:2px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;justify-content:space-around;padding:8px 0 calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px rgba(16,24,40,.08);z-index:5}
nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--sub);gap:2px;flex:1}
nav button span{font-size:22px}
nav button.ativo{color:var(--pri);font-weight:700}
.fab{position:fixed;right:18px;bottom:calc(86px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-size:30px;box-shadow:0 8px 22px rgba(15,118,110,.4);z-index:4}
.aba{display:none}.aba.on{display:block}
.modal{position:fixed;inset:0;background:rgba(8,16,30,.55);display:none;align-items:flex-end;justify-content:center;z-index:10}
.modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:26px 26px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet.alto{height:90vh;display:flex;flex-direction:column}
.sheet h3{margin:0 0 12px;font-size:18px}
.tipos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.tipos button{padding:11px 4px;border-radius:12px;border:2px solid var(--bd);background:var(--card);font-size:13px;font-weight:700;color:var(--txt)}
.tipos button.on{border-color:var(--pri);background:var(--soft);color:var(--pri)}
label.f{display:block;font-size:12px;color:var(--sub);margin:12px 0 4px}
input.c,select.c{width:100%;padding:13px;border:1px solid var(--bd);border-radius:12px;font-size:16px;background:var(--card);color:var(--txt)}
.btn{width:100%;margin-top:16px;padding:15px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-size:16px;font-weight:700}
.btn.sec{background:var(--chip);color:var(--txt);margin-top:8px}
.btn.per{background:transparent;color:var(--out);margin-top:4px;font-weight:600}
.btn.peq{padding:11px;font-size:14px;margin-top:10px}
.hint{font-size:12px;color:var(--sub);margin:6px 0 0}
.rev{flex:1;overflow:auto;margin:6px 0}
.rev .item select{padding:6px;font-size:13px;margin-top:4px;width:auto;max-width:100%}
.rev input[type=checkbox]{width:22px;height:22px;flex:none}
.pre{white-space:pre-wrap;word-break:break-word;font-size:12px;background:var(--bg);border-radius:10px;padding:10px;max-height:140px;overflow:auto;color:var(--sub)}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#1b2333;color:#fff;padding:11px 18px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.linha{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd);font-size:14px}
.linha:last-child{border:0}
.linha small{color:var(--sub)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header id="topo">
  <div class="topo"><h1>💰 Meu Dinheiro</h1><span class="ver" id="verTxt"></span></div>
  <div class="mes" id="barraMes">
    <button data-a="mes" data-n="-1" aria-label="Mês anterior">‹</button>
    <span id="nomeMes"></span>
    <button data-a="mes" data-n="1" aria-label="Próximo mês">›</button>
  </div>
</header>

<main class="wrap">
  <section class="aba on" id="aba-inicio"></section>
  <section class="aba" id="aba-carteira"></section>
  <section class="aba" id="aba-planejar"></section>
  <section class="aba" id="aba-graficos"></section>
  <section class="aba" id="aba-mais"></section>
</main>

<button class="fab" id="fab" data-a="novo" aria-label="Novo lançamento">+</button>

<nav>
  <button class="ativo" data-a="aba" data-n="inicio"><span>🏠</span>Início</button>
  <button data-a="aba" data-n="carteira"><span>💳</span>Carteira</button>
  <button data-a="aba" data-n="planejar"><span>🎯</span>Planejar</button>
  <button data-a="aba" data-n="graficos"><span>📊</span>Gráficos</button>
  <button data-a="aba" data-n="mais"><span>⚙️</span>Mais</button>
</nav>

<div class="modal" id="mdl"><div class="sheet" id="sheet"></div></div>
<input type="file" id="arqExtrato" hidden>
<input type="file" id="arqBackup" accept=".json,application/json" hidden>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ============ Meu Dinheiro · versão 3.0 (app nativo) ============ */
const VERSAO = '3.1';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const iso = (a, m, d) => a + '-' + pad(m + 1) + '-' + pad(d);
const diasNoMes = (a, m) => new Date(a, m + 1, 0).getDate();
const agora = () => new Date();
const hojeISO = () => { const t = agora(); return iso(t.getFullYear(), t.getMonth(), t.getDate()); };
const R = v => ((Math.round((v || 0) * 100) / 100) || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const fmtData = s => s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const norm = t => String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[*_]/g, ' ').replace(/\s+/g, ' ').trim();
const num = t => parseFloat(String(t).replace(/\./g, '').replace(',', '.'));
function addMeses(s, n) {
  const p = s.split('-').map(Number);
  let mm = p[1] - 1 + n;
  const aa = p[0] + Math.floor(mm / 12);
  mm = ((mm % 12) + 12) % 12;
  return iso(aa, mm, Math.min(p[2], diasNoMes(aa, mm)));
}

const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MESES_C = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const DIAS_C = ['dom','seg','ter','qua','qui','sex','sáb'];
const CAT_S = {'Alimentação':'🍽️','Moradia':'🏠','Transporte':'🚗','Saúde':'💊','Lazer':'🎉','Educação':'📚','Compras':'🛍️','Contas':'💡','Pets':'🐾','Dívidas':'🧾','Transferência':'🔁','Fatura':'💳','Outros':'📦'};
const CAT_E = {'Salário':'💼','Renda extra':'💵','Pix recebido':'📲','Depósito':'🏦','Reembolso':'↩️','Transferência':'🔁','Outros':'📦'};
const ICO = Object.assign({}, CAT_S, CAT_E);
const NEUTRAS = ['Transferência', 'Fatura'];
const TIPOS_CONTA = {corrente:'🏦 Conta corrente', poupanca:'🐖 Poupança', carteira:'👛 Carteira (dinheiro)', invest:'📈 Investimentos'};
const CORES = ['#0f766e','#f59e0b','#e11d48','#6366f1','#0ea5e9','#a855f7','#84cc16','#ec4899','#64748b','#14b8a6'];
const GRAD = ['linear-gradient(135deg,#0f766e,#14b8a6)','linear-gradient(135deg,#4338ca,#6366f1)','linear-gradient(135deg,#be123c,#fb7185)','linear-gradient(135deg,#b45309,#f59e0b)','linear-gradient(135deg,#0369a1,#38bdf8)','linear-gradient(135deg,#334155,#64748b)'];
const neutro = l => NEUTRAS.includes(l.cat);
const ehEntrada = l => l.tipo === 'entrada';

/* ---------- dados ---------- */
const KEY = 'md2';
function dbPadrao() { return {v:2, contas:[], cartoes:[], lanc:[], pagos:{}, orc:{}, metas:[], regras:{}, cfg:{tema:'auto', nome:''}, ultConta:''}; }
function normaliza(d) {
  ['contas','cartoes','lanc','metas'].forEach(k => { if (!Array.isArray(d[k])) d[k] = []; });
  ['pagos','orc','regras'].forEach(k => { if (!d[k] || typeof d[k] !== 'object' || Array.isArray(d[k])) d[k] = {}; });
  d.cfg = Object.assign({tema:'auto', nome:''}, d.cfg || {});
  d.lanc = d.lanc.filter(l => l && typeof l.data === 'string' && l.data.length === 10 && isFinite(l.valor));
  d.lanc.forEach(l => { l.id = String(l.id); });
  return d;
}
function carregar() {
  const d = dbPadrao();
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      Object.assign(d, JSON.parse(raw));
    } else {
      const velho = JSON.parse(localStorage.getItem('financas') || 'null');   // migra a versão 1
      if (velho && Array.isArray(velho.lanc)) d.lanc = velho.lanc.map(l => Object.assign({}, l, {cat: l.cat || 'Outros', conta: null, cartao: null}));
      const rv = JSON.parse(localStorage.getItem('regrasUser') || 'null');
      if (rv && typeof rv === 'object') d.regras = rv;
    }
  } catch (e) {}
  return normaliza(d);
}
let db = carregar();
let cacheMes = {};
function salvaDB() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} }
function salva() { salvaDB(); cacheMes = {}; }

/* ---------- estado da tela ---------- */
const hoje0 = agora();
let ano = hoje0.getFullYear(), mes = hoje0.getMonth(), diaSel = hoje0.getDate();
let abaAtual = 'inicio', visao = 'cal', busca = '', filtro = 'todas';
let tipoAtual = 'saida', editId = null, pendentes = [], fatSel = {}, fatCard = null, impDups = 0;

/* ---------- lançamentos por mês ---------- */
function doMes(a, m) {
  const k = a + '-' + m;
  if (cacheMes[k]) return cacheMes[k];
  const ult = diasNoMes(a, m), ini = iso(a, m, 1), fim = iso(a, m, ult), out = [];
  db.lanc.forEach(l => {
    if (l.rep) {
      if (l.data > fim) return;
      const d = Math.min(+l.data.slice(8, 10), ult);
      out.push(Object.assign({}, l, {dia:d, dataOc:iso(a, m, d)}));
    } else if (l.data >= ini && l.data <= fim) {
      out.push(Object.assign({}, l, {dia:+l.data.slice(8, 10), dataOc:l.data}));
    }
  });
  out.sort((x, y) => x.dia - y.dia);
  return (cacheMes[k] = out);
}
const doDia = (a, m, d) => doMes(a, m).filter(l => l.dia === d);
function totaisMes(a, m) {
  let e = 0, s = 0;
  doMes(a, m).forEach(l => { if (neutro(l)) return; if (ehEntrada(l)) e += l.valor; else s += l.valor; });
  return {e, s};
}

/* ---------- contas ---------- */
function contaOcorrencias(l, ate) {
  if (l.data > ate) return 0;
  const p0 = l.data.split('-').map(Number), p1 = ate.split('-').map(Number);
  let a = p0[0], m = p0[1] - 1, n = 0;
  while (a < p1[0] || (a === p1[0] && m <= p1[1] - 1)) {
    const dt = iso(a, m, Math.min(+l.data.slice(8, 10), diasNoMes(a, m)));
    if (dt >= l.data && dt <= ate) n++;
    m++; if (m > 11) { m = 0; a++; }
  }
  return n;
}
function saldoConta(c) {
  let s = c.saldoIni || 0;
  const hj = hojeISO();
  db.lanc.forEach(l => {
    if (l.conta !== c.id || l.cartao) return;
    const sinal = ehEntrada(l) ? 1 : -1;
    if (l.rep) s += sinal * l.valor * contaOcorrencias(l, hj);
    else if (l.data <= hj) s += sinal * l.valor;
  });
  return s;
}

/* ---------- cartões ---------- */
function ciclo(c, a, m) {
  const fim = iso(a, m, Math.min(c.fechamento, diasNoMes(a, m)));
  let pa = a, pm = m - 1; if (pm < 0) { pm = 11; pa--; }
  const ini = iso(pa, pm, Math.min(c.fechamento, diasNoMes(pa, pm)));
  let va = a, vm = m;
  if (c.vencimento <= c.fechamento) { vm++; if (vm > 11) { vm = 0; va++; } }
  const venc = iso(va, vm, Math.min(c.vencimento, diasNoMes(va, vm)));
  return {ini, fim, venc};
}
function itensFatura(c, a, m) {
  const cy = ciclo(c, a, m);
  return db.lanc.filter(l => l.cartao === c.id && !l.pagCartao && l.data > cy.ini && l.data <= cy.fim);
}
const totalFatura = (c, a, m) => itensFatura(c, a, m).reduce((s, l) => s + l.valor, 0);
const pagoFatura = (c, a, m) => db.lanc.filter(l => l.pagCartao === c.id && l.fatKey === a + '-' + pad(m + 1)).reduce((s, l) => s + l.valor, 0);
function limiteUsado(c) {
  const comp = db.lanc.filter(l => l.cartao === c.id && !l.pagCartao).reduce((s, l) => s + l.valor, 0);
  const pg = db.lanc.filter(l => l.pagCartao === c.id).reduce((s, l) => s + l.valor, 0);
  return Math.max(0, comp - pg);
}
function mesFaturaAberta(c) {
  const t = agora(); let a = t.getFullYear(), m = t.getMonth();
  if (t.getDate() > c.fechamento) { m++; if (m > 11) { m = 0; a++; } }
  return {a, m};
}

/* ---------- classificação automática ---------- */
const REGRAS_S = [
  [/mercado livre|mercadolivre|shopee|amazon|americanas|shein|magalu|casas bahia|aliexpress/, 'Compras'],
  [/servicos de cob|cobranca|\bcob\b/, 'Dívidas'],
  [/mercado|minimerc|atacad|supermerc|panif|padaria|sousapadaria|bomdiapao|lanchonete|carnes|acougue|hortifruti|sacolao|alisonaleit|99 ?food|ifood|restaurante|pizzar|lanches|sorvet|confeit|churrasc|lbs comercio/, 'Alimentação'],

/* ---------- aba Gráficos ---------- */
const cor = v => (getComputedStyle(document.documentElement).getPropertyValue(v) || '#888').trim();
function prepCanvas(cv, h) {
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth || 300;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); cv.style.height = h + 'px';
  const x = cv.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0);
  return {x, w, h};
}
function barraArred(x, px, py, w, h, r) {
  if (h <= 0.5) return;
  r = Math.min(r, w / 2, h);
  x.beginPath();
  if (x.roundRect) x.roundRect(px, py, w, h, [r, r, 0, 0]); else x.rect(px, py, w, h);
  x.fill();
}
function desenhaBarras() {
  const cv = $('gBarras'); if (!cv) return;
  const alt = 190, {x, w} = prepCanvas(cv, alt), dados = [];
  for (let i = 5; i >= 0; i--) { let m = mes - i, a = ano; while (m < 0) { m += 12; a--; } const t = totaisMes(a, m); dados.push({n:MESES_C[m], e:t.e, s:t.s}); }
  const max = Math.max(1, ...dados.map(d => Math.max(d.e, d.s))), larg = w / 6, base = alt - 24, topo = 14;
  x.clearRect(0, 0, w, alt);
  x.strokeStyle = cor('--bd'); x.lineWidth = 1; x.beginPath(); x.moveTo(0, base + .5); x.lineTo(w, base + .5); x.stroke();
  dados.forEach((d, i) => {
    const bw = Math.min(22, larg * .28), cx = i * larg + larg / 2;
    x.fillStyle = cor('--in'); barraArred(x, cx - bw - 2, base - (d.e / max) * (base - topo), bw, (d.e / max) * (base - topo), 6);
    x.fillStyle = cor('--out'); barraArred(x, cx + 2, base - (d.s / max) * (base - topo), bw, (d.s / max) * (base - topo), 6);
    x.fillStyle = cor('--sub'); x.font = '11px sans-serif'; x.textAlign = 'center'; x.fillText(d.n, cx, alt - 6);
  });
}
function desenhaRosca(ents, total) {
  const cv = $('gRosca'); if (!cv) return;
  const {x, w} = prepCanvas(cv, 200), cx = w / 2, cy = 100, r = 86, ri = 54;
  x.clearRect(0, 0, w, 200);
  let ang = -Math.PI / 2;
  ents.forEach((e, i) => {
    const f = e[1] / total * Math.PI * 2;
    x.beginPath(); x.arc(cx, cy, r, ang, ang + f); x.arc(cx, cy, ri, ang + f, ang, true); x.closePath();
    x.fillStyle = CORES[i % CORES.length]; x.fill(); ang += f;
  });
  x.fillStyle = cor('--txt'); x.font = 'bold 15px sans-serif'; x.textAlign = 'center'; x.fillText(R(total), cx, cy + 5);
}
function renderGraficos() {

  lm.forEach(l => { porCat[l.cat] = (porCat[l.cat] || 0) + l.valor; const k = norm(l.desc); locais[k] = locais[k] || {n:l.desc, v:0, q:0}; locais[k].v += l.valor; locais[k].q++; });
  const ents = Object.entries(porCat).sort((a, b) => b[1] - a[1]);

  const t = agora(), dias = (ano === t.getFullYear() && mes === t.getMonth()) ? t.getDate() : diasNoMes(ano, mes);
  const maior = lm.slice().sort((a, b) => b.valor - a.valor)[0];

  }

const RE_VAL = /(\d{1,3}(?:\.\d{3})*,\d{2})\s*([CD])(?![A-Za-z])/;
const RE_IGNORA = /SALDO DIA|SALDO ANTERIOR|SALDO FINAL|CREDITO JUROS|CORRECAO MONETARIA/i;
const RE_HIST = /^(COMPRA CARTAO DEBITO|COMPRA CARTAO CREDITO|DEB PIX QR COD DIN|DEB PIX QR COD EST|DEB PIX CHAVE|CRED PIX CHAVE|PIX RECEBIDO DADOS CONTA|PIX RECEBIDO|DEPOSITO DINH LOTERICO|DEBITO PIX AUTOMATICO|CREDITO FGTS)\s*/i;

// Interpreta um pedaço de texto que começa numa data com hora (uma linha do extrato da Caixa)
function interpretaBloco(b) {
  b = String(b).replace(/\s+/g, ' ').trim();
  const d = b.match(RE_DT);
  if (!d || RE_IGNORA.test(b)) return null;
  const resto = b.slice(d.index + d[0].length);
  const todos = Array.from(resto.matchAll(new RegExp(RE_VAL.source, 'g')));
  if (!todos.length) return null;
  const v = todos[0], u = todos.length > 1 ? todos[todos.length - 1] : null;   // 1º número = valor, último = saldo
  const valor = num(v[1]);
  if (!(valor > 0)) return null;
  let meio = resto.slice(0, v.index).trim(), nr = '';
  const doc = meio.match(/^(\d{6})\s*/);
  if (doc) { nr = doc[1]; meio = meio.slice(doc[0].length); }
  let hist = '', nome = meio;
  const mh = meio.match(RE_HIST);
  if (mh) { hist = mh[1]; nome = meio.slice(mh[0].length); }
  else {
    const toks = meio.split(' '); let i = 0;
    while (i < toks.length && /^[A-ZÀ-Ý]{2,}$/.test(toks[i])) i++;
    hist = toks.slice(0, i).join(' '); nome = toks.slice(i).join(' ');
  }
  nome = nome.replace(/\*{2,3}[\d.\/]*\*{2,3}/g, '').replace(/\s+/g, ' ').trim() || hist || 'Lançamento';
  const dt = d[3] + d[2] + d[1] + ' ' + d[4] + ' ' + nr;
  return {data:d[3] + '-' + d[2] + '-' + d[1], valor, entrada:v[2] === 'C', nome, hist, k:'ext:' + dt + ' ' + v[1] + v[2], dt,
    a:{v:valor, c:v[2] === 'C', t:v[1] + v[2]}, b:u ? {v:num(u[1]), c:u[2] === 'C', t:u[1] + u[2]} : null};
}
// Extrato tem duas colunas (valor e saldo). A conta corrida decide qual é qual:
// o certo é aquele cuja variação do saldo, de uma linha para a outra, bate com o valor.
function fixaOrientacao(itens) {
  const c = itens.filter(i => i.b && i.b.v > 0);
  if (c.length < 2) return;
  const sg = x => x.c ? x.v : -x.v;
  let ab = 0, ba = 0;
  for (let i = 1; i < c.length; i++) {
    const p = c[i - 1], q = c[i];
    if (Math.abs(Math.abs(sg(q.b) - sg(p.b)) - q.a.v) < 0.02) ab++;
    if (Math.abs(Math.abs(sg(q.a) - sg(p.a)) - q.b.v) < 0.02) ba++;
  }
  if (ba > ab) c.forEach(i => { const x = i.a; i.a = i.b; i.b = x; i.valor = i.a.v; i.entrada = i.a.c; i.k = 'ext:' + i.dt + ' ' + i.a.t; });
}
// Recebe o texto do PDF de duas formas (linhas por posição e texto corrido) e fica com a que achar mais lançamentos
function itensDoTexto(linhas, corrido) {
  const a = [];
  linhas.forEach(l => { const it = interpretaBloco(l); if (it) a.push(it); });
  const b = [], re = new RegExp(RE_DT.source, 'g'), marcas = [];
  let m;
  while ((m = re.exec(corrido)) !== null) marcas.push(m.index);
  marcas.forEach((ini, i) => { const it = interpretaBloco(corrido.substring(ini, i + 1 < marcas.length ? marcas[i + 1] : corrido.length)); if (it) b.push(it); });
  const itens = b.length > a.length ? b : a;
  fixaOrientacao(itens);
  const cm = corrido.match(/Cliente\s+(.+?)\s+Conta\b/);
  if (cm) itens.cliente = cm[1].trim();
  return itens;
}
function carregaScript(src) {
  return new Promise((ok, erro) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => erro(new Error('Sem internet para carregar ' + src)); document.head.appendChild(s); });
}
async function lerPDF(arq, aviso) {
  if (!window.pdfjsLib) {
    let worker = 'libs/pdf.worker.min.js';
    try { await carregaScript('libs/pdf.min.js'); }
    catch (e) {
      await carregaScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
      worker = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
    pdfjsLib.GlobalWorkerOptions.workerSrc = worker;
  }
  const pdf = await pdfjsLib.getDocument({data:await arq.arrayBuffer()}).promise;
  const linhas = []; let corrido = '', chars = 0;
  for (let p = 1; p <= pdf.numPages; p++) {
    const cont = await (await pdf.getPage(p)).getTextContent();
    const its = cont.items.filter(i => i.str && i.str.trim());
    chars += its.reduce((s, i) => s + i.str.length, 0);
    corrido += ' ' + its.map(i => i.str).join(' ');
    its.sort((a, b) => b.transform[5] - a.transform[5]);
    let grupo = null; const grupos = [];
    its.forEach(i => { if (!grupo || Math.abs(grupo.y - i.transform[5]) > 3) { grupo = {y:i.transform[5], its:[]}; grupos.push(grupo); } grupo.its.push(i); });
    grupos.forEach(g => { g.its.sort((a, b) => a.transform[4] - b.transform[4]); linhas.push(g.its.map(i => i.str).join(' ')); });
  }
  let itens = itensDoTexto(linhas, corrido), amostra = corrido.replace(/\s+/g, ' ').trim().slice(0, 260), ocr = false;
  if (!itens.length && chars < 40) {   // PDF que é só imagem: tenta ler por OCR
    try {
      aviso('O PDF é uma imagem. Lendo por reconhecimento de texto, pode demorar…');
      if (!window.Tesseract) await carregaScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
      const worker = await Tesseract.createWorker('por');
      let texto = '';
      for (let p = 1; p <= pdf.numPages; p++) {
        aviso('Lendo a imagem do PDF, página ' + p + ' de ' + pdf.numPages + '…');
        const pag = await pdf.getPage(p), vp = pag.getViewport({scale:2.2}), cv = document.createElement('canvas');
        cv.width = vp.width; cv.height = vp.height;
        await pag.render({canvasContext:cv.getContext('2d'), viewport:vp}).promise;
        texto += '\n' + (await worker.recognize(cv)).data.text;
      }
      await worker.terminate();
      itens = itensDoTexto(texto.split('\n'), texto.replace(/\s+/g, ' '));
      amostra = texto.replace(/\s+/g, ' ').trim().slice(0, 260); ocr = true;
    } catch (e) { amostra = 'Falha na leitura por imagem: ' + e.message; }
  }
  return {itens, diag:'Texto lido do PDF: ' + chars + ' caracteres' + (ocr ? ' (por imagem)' : '') + '.\nInício: ' + amostra};
}
async function lerTexto(arq) {
  const buf = await arq.arrayBuffer();
  let t = new TextDecoder('utf-8').decode(buf);
  if (/CHARSET:\s*1252/i.test(t) || t.indexOf('\ufffd') >= 0) { try { t = new TextDecoder('windows-1252').decode(buf); } catch (e) {} }
  return t;
}
function lerOFX(texto) {
  const itens = [];
  texto.split(/<STMTTRN>/i).slice(1).forEach(b => {
    const pega = tag => { const m = b.match(new RegExp('<' + tag + '>([^<\\r\\n]+)', 'i')); return m ? m[1].trim() : ''; };
    const dt = pega('DTPOSTED'), valor = parseFloat(pega('TRNAMT').replace(',', '.'));
    if (!dt || isNaN(valor) || valor === 0) return;
    const fit = pega('FITID');
    itens.push({data:dt.slice(0, 4) + '-' + dt.slice(4, 6) + '-' + dt.slice(6, 8), valor:Math.abs(valor), entrada:valor > 0, nome:pega('NAME') || pega('MEMO') || 'Lançamento', hist:pega('MEMO'), k:fit ? 'ofx:' + fit : ''});
  });
  return itens;
}
function csvDivide(linha, sep) {
  const out = []; let cel = '', asp = false;
  for (const ch of linha) {
    if (ch === '"') asp = !asp;
    else if (ch === sep && !asp) { out.push(cel.trim()); cel = ''; }
    else cel += ch;
  }
  out.push(cel.trim());
  return out;
}
function lerCSV(texto) {
  const itens = [], linhas = texto.split(/\r?\n/).filter(l => l.trim());
  if (!linhas.length) return itens;
  const sep = (linhas[0].match(/;/g) || []).length >= (linhas[0].match(/,/g) || []).length && linhas[0].includes(';') ? ';' : ',';
  const reVal = /^-?\s*(?:R\$\s*)?-?\d{1,3}(?:\.\d{3})*,\d{2}\s*[CD]?$|^-?\d+\.\d{2}$/i;
  linhas.forEach(l => {
    const c = csvDivide(l, sep);
    let data = '';
    for (const x of c) {
      const a = x.match(/(\d{2})\/(\d{2})\/(\d{4})/), b = x.match(/(\d{4})-(\d{2})-(\d{2})/);
      if (a) { data = a[3] + '-' + a[2] + '-' + a[1]; break; }
      if (b) { data = b[0]; break; }
    }
    if (!data) return;
    let vm = null;
    for (let i = c.length - 1; i >= 0; i--) if (reVal.test(c[i])) { vm = c[i]; break; }
    if (!vm) return;
    const neg = vm.includes('-') || /D\s*$/i.test(vm);
    const limpo = vm.replace(/R\$|\s|-|[CD]$/gi, '');
    const valor = limpo.includes(',') ? num(limpo) : parseFloat(limpo);
    if (!(valor > 0)) return;
    const nome = c.filter(x => x && x !== vm && !/^\d{1,2}[\/-]\d{1,2}[\/-]\d{2,4}/.test(x) && !/^-?[\d.,]+$/.test(x)).join(' ');
    itens.push({data, valor, entrada:!neg, nome:nome || 'Lançamento', hist:'', k:''});
  });
  return itens;
}
function avisoImport(titulo, texto, diag) {
  abreSheet('<h3>' + esc(titulo) + '</h3><p>' + esc(texto) + '</p>' + (diag ? '<p class="hint">Se pedirem, mande este texto para quem está ajudando:</p><div class="pre">' + esc(diag) + '</div>' : '') + '<button class="btn" data-a="fechar">Entendi</button>');
}
async function importarArquivo(input) {
  const arq = input.files && input.files[0]; if (!arq) return;
  const nome = arq.name.toLowerCase();
  let itens = [], diag = '';
  toast('Lendo o arquivo…');
  try {
    if (nome.endsWith('.pdf') || arq.type === 'application/pdf') { const r = await lerPDF(arq, toast); itens = r.itens; diag = r.diag; }
    else { const txt = await lerTexto(arq); itens = (/<STMTTRN>/i.test(txt) || nome.endsWith('.ofx')) ? lerOFX(txt) : lerCSV(txt); }
  } catch (e) {
    input.value = '';
    avisoImport('Não consegui ler o arquivo', String(e && e.message || e) + '. Se for PDF escaneado (imagem), é preciso internet na primeira leitura.', '');
    return;
  }
  input.value = '';
  if (!itens.length) { avisoImport('Não encontrei lançamentos', 'O arquivo foi aberto, mas nenhuma linha de movimentação foi reconhecida.', diag); return; }
  if (itens.cliente && !db.cfg.nome) { db.cfg.nome = itens.cliente; salvaDB(); }
  const kSet = new Set(db.lanc.map(l => l.k).filter(Boolean));
  const fSet = new Set(db.lanc.map(l => l.data + '|' + l.valor + '|' + norm(l.desc) + '|' + l.tipo));
  impDups = 0; pendentes = [];
  itens.forEach(it => {
    const desc = nomeLimpo(it.nome) || (it.entrada ? 'Entrada' : 'Saída');
    const dup = it.k ? kSet.has(it.k) : fSet.has(it.data + '|' + it.valor + '|' + norm(desc) + '|' + (it.entrada ? 'entrada' : 'saida'));
    if (dup) { impDups++; return; }
    pendentes.push({i:pendentes.length, data:it.data, valor:it.valor, entrada:it.entrada, nome:it.nome, desc, k:it.k, cat:classifica(it.nome, it.hist, it.entrada), marcado:true});
  });
  if (!pendentes.length) { avisoImport('Tudo já estava importado', 'Os ' + impDups + ' lançamentos desse arquivo já estão no app.', ''); return; }
  abrirRevisao();
}
function abrirRevisao() {
  const ent = pendentes.filter(p => p.entrada).length;
  abreSheet('<h3>Revisar extrato</h3><p class="hint" style="margin:0 0 6px" id="revResumo"></p>'
    + '<label class="f" style="margin-top:4px">Importar para a conta</label><select class="c" id="impConta" data-ch="impConta">' + optsConta(db.ultConta) + '<option value="__nova">➕ Nova conta…</option></select>'
    + '<div class="rev" id="revLista"></div>'
    + '<button class="btn" data-a="confirmaImport" id="btnImp">Importar</button><button class="btn sec" data-a="marcaTodos">Marcar ou desmarcar todos</button><button class="btn sec" style="margin-top:6px" data-a="fechar">Cancelar</button>', true);
  $('revResumo').textContent = pendentes.length + ' lançamentos (' + ent + ' entradas, ' + (pendentes.length - ent) + ' saídas)' + (impDups ? ' · ' + impDups + ' já importados foram ignorados' : '') + '. Confira as categorias.';
  renderRev();
}
function renderRev() {
  const el = $('revLista'), topo = el.scrollTop;
  el.innerHTML = pendentes.map(p =>
    '<div class="item"><input type="checkbox" data-ch="marca" data-i="' + p.i + '"' + (p.marcado ? ' checked' : '') + '>'
    + '<div class="t"><b>' + esc(p.desc) + '</b><small>' + fmtData(p.data) + '</small>'
    + '<select class="c" data-ch="catImp" data-i="' + p.i + '">' + optsCat(p.entrada, p.cat) + '</select></div>'
    + '<b class="val ' + (neutro(p) ? 'neu' : p.entrada ? 'in' : 'out') + '">' + (p.entrada ? '+ ' : '− ') + R(p.valor) + '</b></div>').join('');
  el.scrollTop = topo;
  const n = pendentes.filter(p => p.marcado).length;
  $('btnImp').textContent = 'Importar ' + n + (n === 1 ? ' lançamento' : ' lançamentos');
}
function confirmaImport() {
  const marcados = pendentes.filter(p => p.marcado);
  if (!marcados.length) { toast('Nenhum lançamento marcado'); return; }
  let conta = $('impConta').value;
  if (conta === '__nova') conta = '';
  if (conta) db.ultConta = conta;
  marcados.forEach(p => {
    db.lanc.push({id:uid(), tipo:p.entrada ? 'entrada' : 'saida', desc:p.desc, valor:p.valor, data:p.data, cat:p.cat, conta:conta || null, cartao:null, rep:false, k:p.k || ''});
  });
  const ult = marcados.map(p => p.data).sort().pop().split('-').map(Number);
  ano = ult[0]; mes = ult[1] - 1; diaSel = ult[2];
  const n = marcados.length;
  salva(); fechaSheet(); abaAtual = 'inicio'; document.querySelectorAll('.aba').forEach(a => a.classList.remove('on')); $('aba-inicio').classList.add('on');
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('ativo', b.dataset.n === 'inicio'));
  render(); toast(n + ' lançamentos importados');
}

/* ---------- eventos ---------- */
const ACOES = {
  mes: d => mudaMes(+d.n),
  aba: d => irAba(d.n),
  novo: () => formLanc(null),
  edita: d => { const l = db.lanc.find(x => x.id === d.id); if (l) formLanc(l); },
  selDia: d => { diaSel = +d.d; renderInicio(); },
  visao: d => { visao = d.v; renderInicio(); },
  filtro: d => { filtro = d.f; renderInicio(); },
  tipoL: d => trocaTipo(d.t, null),
  salvarL: salvarLanc, apagarL: apagarLanc, fechar: fechaSheet,
  novaConta: () => formConta(null), editaConta: d => formConta(d.id), salvarConta, apagarConta, ajustaSaldo: d => ajustaSaldo(d.id),
  novoCartao: () => formCartao(null), editaCartao: d => formCartao(d.id), salvarCartao, apagarCartao,
  verFatura: d => abrirFatura(d.id),
  fatMes: d => { const f = fatSel[fatCard]; let m = f.m + (+d.n), a = f.a; if (m < 0) { m = 11; a--; } if (m > 11) { m = 0; a++; } fatSel[fatCard] = {a, m}; renderFatura(); },
  pagarFatura: formPagar, salvarPag,
  orc: formOrc, salvarOrc,
  novaMeta: () => formMeta(null), editaMeta: d => formMeta(d.id), salvarMeta, apagarMeta, depMeta: d => depositarMeta(d.id),
  pago: d => { const k = d.id + '|' + d.ym; if (db.pagos[k]) delete db.pagos[k]; else db.pagos[k] = true; salva(); renderPlanejar(); },
  expJSON, expCSV, impJSON: () => $('arqBackup').click(),
  apagaRegra: d => { delete db.regras[d.k]; salva(); renderMais(); },
  limpaTudo: () => { if (confirm('Apagar TODOS os dados do app neste aparelho? Isso não tem volta.') && confirm('Tem certeza mesmo? Faça um backup antes se quiser guardar algo.')) { db = dbPadrao(); salva(); render(); toast('Dados apagados'); } },
  marcaTodos: () => { const todos = pendentes.every(p => p.marcado); pendentes.forEach(p => { p.marcado = !todos; }); renderRev(); },
  confirmaImport
};
const MUDA = {
  tema: el => { db.cfg.tema = el.value; salvaDB(); document.documentElement.dataset.tema = el.value; if (abaAtual === 'graficos') renderGraficos(); },
  marca: (el, d) => { pendentes[+d.i].marcado = el.checked; const n = pendentes.filter(p => p.marcado).length; $('btnImp').textContent = 'Importar ' + n + (n === 1 ? ' lançamento' : ' lançamentos'); },
  catImp: (el, d) => {
    const p = pendentes[+d.i]; p.cat = el.value;
    const chave = norm(p.nome);
    db.regras[chave] = el.value; salvaDB();
    pendentes.forEach(o => { if (norm(o.nome) === chave) o.cat = el.value; });
    renderRev();
  },
  impConta: el => {
    if (el.value !== '__nova') return;
    const nome = prompt('Nome da nova conta (ex: Caixa)');
    if (nome && nome.trim()) {
      const c = {id:uid(), nome:nome.trim(), tipo:'corrente', saldoIni:0};
      db.contas.push(c); db.ultConta = c.id; salvaDB();
      el.innerHTML = optsConta(c.id) + '<option value="__nova">➕ Nova conta…</option>';
    } else el.value = db.ultConta || '';
  }
};
const DIGITA = {
  busca: el => { busca = el.value; renderLista(); },
  nome: el => { db.cfg.nome = el.value.trim(); salvaDB(); }
};
document.addEventListener('click', e => {
  if (e.target && e.target.id === 'mdl') { fechaSheet(); return; }
  const el = e.target.closest ? e.target.closest('[data-a]') : null;
  if (el && ACOES[el.dataset.a]) ACOES[el.dataset.a](el.dataset, el);
});
document.addEventListener('change', e => { const el = e.target; if (el.dataset && el.dataset.ch && MUDA[el.dataset.ch]) MUDA[el.dataset.ch](el, el.dataset); });
document.addEventListener('input', e => { const el = e.target; if (el.dataset && el.dataset.in && DIGITA[el.dataset.in]) DIGITA[el.dataset.in](el); });
$('arqExtrato').addEventListener('change', e => importarArquivo(e.target));
$('arqBackup').addEventListener('change', e => impJSON(e.target));

/* ---------- início ---------- */
document.documentElement.dataset.tema = db.cfg.tema;
render();

/* ---------- integração com o Android ---------- */
if (nativo()) {
  const sb = plug('StatusBar');
  if (sb) { try { sb.setBackgroundColor({color:'#0f766e'}); sb.setStyle({style:'DARK'}); } catch (e) {} }
  const ap = plug('App');
  if (ap) {
    ap.addListener('backButton', () => {
      if ($('mdl').classList.contains('on')) fechaSheet();
      else if (abaAtual !== 'inicio') irAba('inicio');
      else ap.exitApp();
    });
    ap.addListener('appStateChange', st => { if (st && st.isActive) render(); });   // vira o dia com o app aberto
  }
  const sp = plug('SplashScreen');
  if (sp) { try { sp.hide(); } catch (e) {} }
}
