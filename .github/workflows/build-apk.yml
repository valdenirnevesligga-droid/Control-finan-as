name: Gerar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Copiar leitor de PDF
        run: npm run libs

      - name: Criar projeto Android
        run: npx cap add android

      - name: Gerar ícones e splash
        run: npx capacitor-assets generate --android

      - name: Ajustar versão e orientação
        run: |
          VC=${{ github.run_number }}
          sed -i "s/versionCode 1/versionCode $VC/; s/versionName \"1.0\"/versionName \"3.0.$VC\"/" android/app/build.gradle
          sed -i 's/<activity /<activity android:screenOrientation="portrait" /' android/app/src/main/AndroidManifest.xml
          # o app guarda tudo no aparelho: não deixar o Android copiar os dados para a nuvem sem querer
          sed -i 's/<application /<application android:allowBackup="false" /' android/app/src/main/AndroidManifest.xml

      - name: Sincronizar
        run: npx cap sync android

      - name: Preparar assinatura (se houver chave)
        id: chave
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > android/app/release.jks
            echo "assinar=sim" >> $GITHUB_OUTPUT
          else
            echo "assinar=nao" >> $GITHUB_OUTPUT
          fi

      - name: Compilar APK assinado (release)
        if: steps.chave.outputs.assinar == 'sim'
        working-directory: android
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$PWD/app/release.jks \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="${KEY_PASS:-$KS_PASS}"
          cp app/build/outputs/apk/release/app-release.apk ../MeuDinheiro.apk

      - name: Compilar APK de teste (sem chave própria)
        if: steps.chave.outputs.assinar == 'nao'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../MeuDinheiro.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MeuDinheiro-apk
          path: MeuDinheiro.apk
          retention-days: 30

      - name: Publicar na aba Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.${{ github.run_number }}
          name: Meu Dinheiro 3.0.${{ github.run_number }}
          files: MeuDinheiro.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
